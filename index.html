<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const divs=n=>{const d=[];for(let i=1;i<=n;i++)if(n%i==0)d.push(i);return d};
let P={};try{P=JSON.parse(localStorage.getItem('dk')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('dk',JSON.stringify(P))}catch(e){}};
const THM=['orange','mint','lilac','green','night','violet','ocean'],NM=['نارنجی روشن','سبز روشن','بنفش روشن','سبز تیره','نارنجی تیره','بنفش تیره','آبی تیره'];let ti=0;
try{const t=localStorage.getItem('dkt');if(t){document.documentElement.dataset.theme=t;ti=THM.indexOf(t)}}catch(e){}
function theme(){ti=(ti+1)%7;document.documentElement.dataset.theme=THM[ti];toast('تم: '+NM[ti]);try{localStorage.setItem('dkt',THM[ti])}catch(e){}}
const T=[{n:'حلقهٔ ساده و قانون اهم',i:'🔋'},{n:'قاعدهٔ انشعاب',i:'🔀'},{n:'ساده‌سازی مدار (متوالی و موازی)',i:'🧩'},{n:'برابری ولتاژ شاخه‌ها',i:'⚖️'},{n:'مدار چندحلقه‌ای',i:'🕸️'},{n:'مقاومت درونی باتری',i:'🔌'},{n:'آمپرسنج و ولت‌سنج',i:'🧭'},{n:'حالت ترکیبی',i:'🌟'}];
const LV=['آسان','متوسط','سخت','بسیار سخت'];
const TIP=['در حلقهٔ ساده جریان همه‌جا یکسان است و جمع افت ولتاژها برابر ولتاژ باتری است.','در هر گره مجموع جریان‌های ورودی با مجموع جریان‌های خروجی برابر است.','مقاومت‌های متوالی را جمع کن و مقاومت‌های موازی را با فرمول موازی ساده کن؛ از دورترین بخش شروع کن.','دو سر همهٔ شاخه‌های موازی به دو گرهٔ مشترک وصل است، پس ولتاژشان یکسان است.'];

/* ===== solver.js: تحلیل گرهٔ اصلاح‌شده (MNA)، با یک گرهٔ مرجع برای هر بخش متصل =====
   عناصر: {t:'r'|'w'|'a'|'v'|'b', a, b, v, r}
   r مقاومت، w سیم، a آمپرسنج آرمانی، v ولت‌سنج آرمانی، b باتری (قطب + در a) با مقاومت درونی r */
const GW=1e6,GV=1e-9;
function solve1(N,els){let n=N;const R=[],S=[];
els.forEach((e,k)=>{if(e.t=='b'){if(e.r>0){const x=n++;R.push([x,e.b,1/e.r]);S.push([e.a,x,e.v,k])}else S.push([e.a,e.b,e.v,k])}else R.push([e.a,e.b,e.t=='r'?1/e.v:e.t=='v'?GV:GW,k])});
const M=n+S.length,A=Array.from({length:M},()=>new Float64Array(M+1));
R.forEach(([a,b,g])=>{A[a][a]+=g;A[b][b]+=g;A[a][b]-=g;A[b][a]-=g});
S.forEach(([p,m,v],j)=>{const c=n+j;A[p][c]+=1;A[m][c]-=1;A[c][p]+=1;A[c][m]-=1;A[c][M]=v});
const par=[...Array(n).keys()],fd=x=>par[x]==x?x:(par[x]=fd(par[x]));R.forEach(([a,b])=>{par[fd(a)]=fd(b)});S.forEach(([p,m])=>{par[fd(p)]=fd(m)});
const seen=new Set();for(let i=0;i<n;i++){const q=fd(i);if(!seen.has(q)){seen.add(q);A[i].fill(0);A[i][i]=1}}
for(let c=0;c<M;c++){let p=c;for(let r=c+1;r<M;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];const d=A[c][c];if(Math.abs(d)<1e-300)continue;for(let r=0;r<M;r++)if(r!=c&&A[r][c]){const f=A[r][c]/d;for(let k=c;k<=M;k++)A[r][k]-=f*A[c][k]}}
const x=A.map((row,i)=>row[i]?row[M]/row[i]:0),V=x.slice(0,N),I=els.map(()=>0);
R.forEach(([a,b,g,k])=>{if(k!==undefined)I[k]=(x[a]-x[b])*g});
S.forEach(([p,m,v,k],j)=>{I[k]=-x[n+j]});
let short=false;for(let k=0;k<I.length;k++){if(Math.abs(I[k])<1e-4)I[k]=0;if(Math.abs(I[k])>1e3)short=true}
return{V,I,short,hasBat:S.length>0}}

/* باتری آرمانی که با سیم کوتاه شده جریان بی‌نهایت دارد؛ برای نمایش، با r=0.5Ω حل می‌کنیم و short=true برمی‌گردانیم */
function solveNet(N,els){let o=solve1(N,els);if(o.short){o=solve1(N,els.map(e=>e.t=='b'&&!(e.r>0)?{...e,r:.5}:e));o.short=true}return o}

/* ---------- آموزش ---------- */
const L=[
`<h3>۱) جریان و قانون اهم</h3><p>جریان الکتریکی آهنگ شارش بار است: <b>I = ΔQ ÷ Δt</b> (یکا: آمپر). جهت قراردادی جریان، در مدار بیرونی از قطب مثبت باتری به قطب منفی است. در انیمیشن‌های بازی، نقطه‌های نارنجی همین جهت را نشان می‌دهند.</p><div class="fm">V = I × R</div><p>ولتاژ بر حسب ولت، مقاومت بر حسب اهم (Ω).</p><h3>۲) حلقهٔ ساده</h3><p>وقتی یک باتری و چند مقاومت پشت هم در یک حلقه‌اند، جریان در همهٔ نقاط حلقه یکسان است. قاعدهٔ حلقه می‌گوید جمع افت‌های ولتاژ مقاومت‌ها برابر ولتاژ باتری است (باتری آرمانی، بدون مقاومت درونی).</p><div class="fm">V = V₁ + V₂ + … &nbsp; | &nbsp; R کل = R₁ + R₂ + …</div><div class="box"><b>مثال:</b> V = 12 ولت، R₁ = 2Ω و R₂ = 4Ω. مقاومت کل ۶Ω است، پس I = 12 ÷ 6 = 2A. افت‌ها: V₁ = 4V و V₂ = 8V که جمعشان ۱۲ ولت است.</div>`,
`<h3>قاعدهٔ انشعاب (قانون جریان کیرشهف)</h3><p>نقطه‌ای که چند سیم در آن به هم می‌رسند «گره» نام دارد. بار الکتریکی در گره نه ساخته می‌شود و نه از بین می‌رود، بنابراین هر مقدار جریان که وارد گره می‌شود به همان اندازه خارج می‌شود.</p><div class="fm">ΣI ورودی = ΣI خروجی</div><div class="box"><b>مثال:</b> جریان‌های ۵A و ۳A وارد گره می‌شوند و جریان ۲A و جریان I از آن خارج می‌شود. 5 + 3 = 2 + I، پس I = 6A.</div><p>در مدار موازی، جریان کل برابر جمع جریان شاخه‌هاست:</p><div class="fm">I = I₁ + I₂ + I₃ + …</div><p>نکته: اگر جهت جریانی را نمی‌دانی، یک جهت فرض کن؛ منفی شدن پاسخ یعنی جهت واقعی برعکس است.</p>`,
`<h3>مقاومت‌های متوالی</h3><p>اگر مقاومت‌ها پشت سر هم باشند، جریان یکسان است و مقاومت‌ها جمع می‌شوند.</p><div class="fm">R<sub>eq</sub> = R₁ + R₂ + R₃ + …</div><h3>مقاومت‌های موازی</h3><div class="fm">1/R<sub>eq</sub> = 1/R₁ + 1/R₂ + …</div><p>برای دو مقاومت: <b>R<sub>eq</sub> = R₁R₂ ÷ (R₁ + R₂)</b>. برای n مقاومت برابر R: <b>R ÷ n</b>. مقاومت معادل موازی همیشه از کوچک‌ترین مقاومت هم کوچک‌تر است.</p><h3>روش ساده‌سازی</h3><p>از دورترین بخش مدار نسبت به باتری شروع کن، هر دسته متوالی یا موازی را با یک مقاومت جایگزین کن، تا یک مقاومت کل بماند؛ سپس I = V ÷ R<sub>eq</sub>.</p><div class="box"><b>مثال:</b> ۳Ω و ۶Ω موازی: (3×6) ÷ 9 = 2Ω. با یک مقاومت ۴Ω متوالی، R<sub>eq</sub> = 6Ω.</div>`,
`<h3>برابری ولتاژ در شاخه‌های موازی</h3><p>دو سر هر شاخهٔ موازی به همان دو گره وصل است؛ پس ولتاژ همهٔ شاخه‌ها با هم برابر است، حتی اگر مقاومت‌هایشان فرق کند.</p><div class="fm">V = I₁R₁ = I₂R₂ = I₃R₃</div><p>در نتیجه شاخه‌ای که مقاومت کمتری دارد جریان بیشتری می‌گیرد.</p><div class="box"><b>مثال:</b> باتری ۱۲ ولت به دو شاخهٔ ۳Ω و ۶Ω وصل است. I₁ = 12÷3 = 4A و I₂ = 12÷6 = 2A، پس جریان کل ۶A.</div><p>اگر پیش از بخش موازی یک مقاومت متوالی R<sub>s</sub> باشد و جریان کل I از آن بگذرد، ولتاژ بخش موازی چنین است:</p><div class="fm">V<sub>موازی</sub> = V<sub>باتری</sub> − I × R<sub>s</sub></div>`];
const SRC='<p class="mut">منابع: D. Halliday, R. Resnick, J. Walker, «Fundamentals of Physics»، بخش مدارهای الکتریکی؛ R. Serway, J. Jewett, «Physics for Scientists and Engineers»، فصل جریان و مدارهای DC؛ کتاب فیزیک ۲ پایهٔ یازدهم (ایران).</p>';

/* ---------- بانک سؤال ---------- */

function uniq(sol,giv,cages){const g=Array(81).fill(0),Rr=Array(9).fill(0),Cc=Array(9).fill(0),Bb=Array(9).fill(0),co=Array(81).fill(-1);cages.forEach((c,i)=>c.cells.forEach(x=>co[x]=i));
const cu=cages.map(()=>0),cs=cages.map(()=>0),cr=cages.map(c=>c.cells.length);
const ok=(i,d)=>{const r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0),m=1<<d;if((Rr[r]|Cc[c]|Bb[b])&m)return 0;const k=co[i];if(k>=0){if(cu[k]&m)return 0;const rem=cr[k]-1,s=cs[k]+d,t=cages[k].sum;if(s>t||(rem==0?s!=t:(t-s<rem||t-s>9*rem)))return 0}return 1};

function tile(sol,mx){const co=Array(81).fill(-1),cg=[];
for(const s of sh([...Array(81).keys()])){if(co[s]>=0)continue;const cells=[s],t=rnd(2,mx);

function logo(){const t=$('#lt'),el=$('#el'),tr=$('#tr');if(!t||!t.getExtentOfChar)return;const b=t.getExtentOfChar(4),bb=t.getBBox(),px=b.x+b.width/2,py=17,x0=bb.x-8,x1=bb.x+bb.width+8,y1=50;

const pos=s=>{s=Math.min(PL,Math.max(0,s));let i=1;while(i<pts.length-1&&ln[i]<s)i++;const f=(s-ln[i-1])/(ln[i]-ln[i-1]||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]};

(function f(now){const c=(now-t0)%C;let x=px,y=py,rr=4.2,d='';
if(c>=A&&c<A+R){const s=(c-A)/R*PL,a=pos(s);x=a[0];y=a[1];const p0=pos(s-26),p1=pos(s+8);d='M'+p0.join(' ');for(let k=1;k<=6;k++){const q=pos(s-26+k*(34/6));d+='L'+q.join(' ')}}

el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('r',Math.max(2,rr));tr.setAttribute('d',d);requestAnimationFrame(f)})(t0)}
